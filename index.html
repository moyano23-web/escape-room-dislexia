<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La biblioteca de las palabras perdidas</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#24334b;background:#f5f1fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#32234e,#67518b);color:white;padding:22px 18px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,40px)}header p{margin:8px 0 0}.wrap{max-width:1000px;margin:24px auto;padding:0 15px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 7px 25px #25103a12;margin-bottom:18px}.muted{color:#626b7c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.btn{border:0;border-radius:11px;background:#67518b;color:white;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#eae3f2;color:#3c2b57}.danger{background:#b84560}.good{background:#267a62}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{border:1px solid #c9c2d4;border-radius:10px;padding:12px;font-size:16px;max-width:100%;width:100%}label{display:block;font-weight:700;margin:12px 0 5px}.mission{border:2px solid #e8e0f0;border-radius:15px;padding:15px}.mission.locked{opacity:.5}.pill{background:#f3e6d5;color:#7e4c20;border-radius:30px;padding:5px 11px;display:inline-block;font-weight:700;font-size:13px}.option{display:block;text-align:left;width:100%;margin:8px 0;background:#f1edf7;color:#2d2640}.option.selected{background:#67518b;color:white}.syll{min-width:80px}.slots{min-height:60px;background:#f3f0f8;border:2px dashed #c9b9da;border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap}.notice{background:#eef8f3;border-left:5px solid #267a62;padding:13px;border-radius:9px;margin:12px 0}.warning{background:#fff3e6;border-left:5px solid #db9d4b;padding:12px;border-radius:9px;margin:12px 0}.hidden{display:none!important}.score{font-size:25px;font-weight:800;color:#67518b}.bigletter{font-size:58px;font-weight:900;color:#67518b;text-align:center}.tiny{font-size:13px}.center{text-align:center}#qr{width:180px;height:180px;object-fit:contain;border:1px solid #ddd;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}button:focus-visible,input:focus-visible{outline:3px solid #ed9c67;outline-offset:2px}@media(max-width:600px){.card{padding:16px}h2{font-size:22px}}</style></head><body><header><h1>📚 La biblioteca de las palabras perdidas</h1><p>Escape Room cooperativo · Dislexia y aprendizaje inclusivo</p></header><main class="wrap" id="app"></main>
<script type="module">
// Firebase Realtime Database is optional. Set up a Firebase project and paste its public web configuration here.
// Enable Anonymous Authentication and deploy database.rules.json before using a real classroom session.
const FIREBASE_CONFIG = null;
const app=document.querySelector('#app');const params=new URLSearchParams(location.search);let room=params.get('s')||'';let teamId=params.get('t')||'';let state=null,db=null,auth=null,uid=null,fb=null,unsub=null;let selection=[],choice='',attempts=0,stage=0,help=false,localMode=false;let hostKey=sessionStorage.getItem('hostKey')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=()=>Math.random().toString(36).slice(2,8).toUpperCase();const names=['Los Exploradores','Los Guardianes','Los Dragones','Las Estrellas','Los Detectives','Los Magos','Los Inventores','Los Lectores','Los Valientes'];
const missions=[{title:'El hechizo de las sílabas',desc:'Ordena las sílabas para formar el nombre de un insecto.',letter:'L',hint:'Empieza por MA. Puedes escuchar la palabra si alguien la lee en voz alta.'},{title:'Los sonidos encantados',desc:'Escucha la palabra y selecciona su sonido inicial.',letter:'I',hint:'La palabra es FOCA. Pronuncia despacio el primer sonido.'},{title:'Las letras desaparecidas',desc:'Completa la palabra: CA_A. Pista: es un lugar donde vivimos.',letter:'B',hint:'La palabra que buscamos es CASA.'},{title:'El libro de los secretos',desc:'Lee o escucha la historia y responde tres preguntas.',letter:'R',hint:'Puedes volver a escuchar el cuento cuantas veces necesites.'},{title:'La mochila de las soluciones',desc:'Elige apoyos que faciliten la participación de todo el alumnado.',letter:'O',hint:'Busca apoyos que den opciones y autonomía, sin excluir a nadie.'}];
function defaultState(code,key){return {code,hostKey:key,status:'waiting',created:Date.now(),teams:{},maxTeams:9,version:1}};
async function init(){if(FIREBASE_CONFIG){try{const a=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');const d=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');const au=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');const f=a.initializeApp(FIREBASE_CONFIG);auth=au.getAuth(f);await au.signInAnonymously(auth);uid=auth.currentUser.uid;db=d.getDatabase(f);fb=d;}catch(e){console.error(e);app.innerHTML='<div class="card warning">No se pudo conectar con Firebase. Comprueba la configuración, las reglas y la conexión a internet.</div>';return;}}else{localMode=true;}if(room)await loadRoom();else home();}
function saveLocal(){localStorage.setItem('escape_'+room,JSON.stringify(state));window.dispatchEvent(new Event('storageLocal'))}
async function write(path,value){if(localMode){if(path===''){state=value}else{const p=path.split('/');let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]]??(o[p[i]]={});o[p.at(-1)]=value;}saveLocal();render();return;}await fb.set(fb.ref(db,'rooms/'+room+(path?'/'+path:'')),value)}
async function updateTeam(id,fields){if(localMode){Object.assign(state.teams[id],fields);saveLocal();render();return;}await fb.update(fb.ref(db,'rooms/'+room+'/teams/'+id),fields)}
async function loadRoom(){if(localMode){state=JSON.parse(localStorage.getItem('escape_'+room)||'null');window.addEventListener('storage',()=>{state=JSON.parse(localStorage.getItem('escape_'+room)||'null');render()});window.addEventListener('storageLocal',()=>{state=JSON.parse(localStorage.getItem('escape_'+room)||'null');render()});render();}else{if(unsub)unsub();unsub=fb.onValue(fb.ref(db,'rooms/'+room),snap=>{state=snap.val();render()},e=>app.innerHTML='<div class="card warning">No se pudo abrir la sala: '+esc(e.message)+'</div>')}}
function home(){app.innerHTML=`<div class="card center"><h2>¿Cómo quieres entrar?</h2><p>Recupera las cinco letras mágicas para abrir la biblioteca.</p><div class="row" style="justify-content:center"><button class="btn" id="create">Crear sala (anfitrión)</button><button class="btn secondary" id="join">Unirme a una sala</button></div>${localMode?'<p class="warning">Modo demostración local: los datos solo se comparten entre pestañas del mismo navegador. Para 45 participantes en distintos dispositivos es obligatorio configurar Firebase y publicar la web.</p>':''}</div>`;document.querySelector('#create').onclick=createRoom;document.querySelector('#join').onclick=()=>{app.innerHTML='<div class="card"><h2>Unirse a la partida</h2><label>Código de sala</label><input id="roomCode" maxlength="6" autocomplete="off" placeholder="Ej. ABC123"><button class="btn" id="go">Continuar</button></div>';document.querySelector('#go').onclick=()=>{room=document.querySelector('#roomCode').value.trim().toUpperCase();if(room)location.href='?s='+encodeURIComponent(room)}}}
async function createRoom(){room=rand();hostKey=crypto.randomUUID();sessionStorage.setItem('hostKey',hostKey);const s=defaultState(room,hostKey);if(!localMode){await fb.set(fb.ref(db,'rooms/'+room),s)}else{state=s;saveLocal()}location.href='?s='+encodeURIComponent(room)}
function isHost(){return !!(state&&hostKey===state.hostKey)}function currentTeam(){return state?.teams?.[teamId]}function render(){if(!state){app.innerHTML='<div class="card"><h2>Sala no encontrada</h2><p>Comprueba el código o solicita un nuevo enlace al profesor.</p><a href="./">Volver al inicio</a></div>';return;}if(isHost())return hostView();if(teamId&&currentTeam())return teamView();return joinView()}
function url(){return location.origin+location.pathname+'?s='+encodeURIComponent(room)}
function hostView(){const teams=Object.entries(state.teams||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Panel del anfitrión</h2><span class="pill">Sala ${esc(room)}</span></div><p>Estado: <strong>${{waiting:'Esperando equipos',playing:'Partida en curso',paused:'Pausada',finished:'Finalizada'}[state.status]}</strong></p><div class="grid"><div><label>Enlace para jugadores</label><input id="link" readonly value="${esc(url())}"><button class="btn secondary" id="copy">Copiar enlace</button></div><div class="center"><img id="qr" alt="QR para entrar en la sala" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url())}"><p class="tiny muted">Si el QR no carga, comparte el enlace.</p></div></div>${localMode?'<div class="warning">Demostración local: esta sala no funciona entre móviles diferentes hasta conectar Firebase.</div>':''}<div class="row"><button class="btn good" id="start" ${state.status==='playing'?'disabled':''}>${state.status==='paused'?'Reanudar':'Iniciar partida'}</button><button class="btn secondary" id="pause" ${state.status!=='playing'?'disabled':''}>Pausar</button><button class="btn danger" id="finish">Finalizar</button><button class="btn secondary" id="reset">Reiniciar puntuaciones</button></div></div><div class="card"><h2>🔊 Sonido exclusivo del anfitrión</h2><p>Conecta el ordenador al proyector y sus altavoces. Solo este panel reproduce las narraciones; los móviles de los equipos permanecen en silencio.</p><div class="row"><button class="btn secondary" id="hostIntro">Presentar aventura</button><button class="btn secondary" id="hostFoca">Misión 2: escuchar FOCA</button><button class="btn secondary" id="hostStory">Misión 4: escuchar cuento</button><button class="btn secondary" id="hostStop">Detener audio</button></div><label for="hostMission">Instrucciones de una misión</label><select id="hostMission">${missions.map((m,i)=>`<option value="${i}">${i+1}. ${esc(m.title)}</option>`).join('')}</select><button class="btn secondary" id="hostReadMission">Leer instrucciones por altavoces</button><p class="tiny muted">El navegador puede requerir pulsar un botón para habilitar la voz.</p></div><div class="card"><h2>Clasificación en directo (${teams.length}/${state.maxTeams} equipos)</h2><table><thead><tr><th>Equipo</th><th>Misión</th><th>Puntos</th><th>Estado</th></tr></thead><tbody>${teams.map(([id,t],i)=>`<tr><td>${i+1}. ${esc(t.name)}</td><td>${Math.min(t.progress||0,5)}/5</td><td><strong>${t.score||0}</strong></td><td>${t.done?'Escapó':t.progress?'Jugando':'Preparado'}</td></tr>`).join('')||'<tr><td colspan="4">Esperando equipos…</td></tr>'}</tbody></table></div>`;document.querySelector('#hostIntro').onclick=()=>speak('Bienvenidos a la biblioteca de las palabras perdidas. Para salvar sus libros, tendréis que superar cinco misiones y descubrir la contraseña final.');document.querySelector('#hostFoca').onclick=()=>speak('Foca');document.querySelector('#hostStory').onclick=()=>speak('Ana fue a la biblioteca con su hermano Leo. Encontraron un libro sobre animales y lo leyeron juntos en una mesa azul.');document.querySelector('#hostStop').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel()};document.querySelector('#hostReadMission').onclick=()=>{const m=missions[Number(document.querySelector('#hostMission').value)];speak(m.title+'. '+m.desc)};document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(url()).then(()=>alert('Enlace copiado'));document.querySelector('#start').onclick=()=>write('status','playing');document.querySelector('#pause').onclick=()=>write('status','paused');document.querySelector('#finish').onclick=()=>{if(confirm('¿Finalizar la partida?'))write('status','finished')};document.querySelector('#reset').onclick=async()=>{if(!confirm('¿Reiniciar los progresos de todos los equipos?'))return;for(const [id,t] of teams)await updateTeam(id,{progress:0,score:0,done:false,tries:{}});await write('status','waiting')}}
function joinView(){const teams=Object.entries(state.teams||{});app.innerHTML=`<div class="card"><h2>Entrar en la biblioteca</h2><p>Sala <strong>${esc(room)}</strong>. Forma un equipo de hasta cinco personas y selecciona su nombre.</p><label>Equipo</label><select id="teamSelect"><option value="">Selecciona tu equipo</option>${names.map((n,i)=>`<option value="${i+1}" ${teams.some(([id])=>id===String(i+1))?'disabled':''}>${esc(n)}${teams.some(([id])=>id===String(i+1))?' (ocupado)':''}</option>`).join('')}</select><button class="btn" id="enter">Entrar</button><p class="muted tiny">Un dispositivo por equipo. El anfitrión controla el inicio de la partida.</p></div>`;document.querySelector('#enter').onclick=async()=>{const id=document.querySelector('#teamSelect').value;if(!id)return alert('Selecciona un equipo');if(state.teams?.[id])return alert('Este equipo ya está ocupado');if(localMode){state.teams[id]={name:names[+id-1],progress:0,score:0,tries:{},done:false};saveLocal()}else{const ref=fb.ref(db,'rooms/'+room+'/teams/'+id);const result=await fb.runTransaction(ref,t=>t===null?{name:names[+id-1],progress:0,score:0,tries:{},done:false}:undefined);if(!result.committed)return alert('Este equipo ya está ocupado')}teamId=id;sessionStorage.setItem('team_'+room,id);location.href='?s='+encodeURIComponent(room)+'&t='+id}}
function teamView(){const t=currentTeam();if(state.status==='waiting')return app.innerHTML=`<div class="card center"><h2>¡Equipo ${esc(t.name)} preparado!</h2><p>Esperad a que el anfitrión inicie la aventura.</p><span class="pill">Sala ${esc(room)}</span></div>`;if(state.status==='paused')return app.innerHTML='<div class="card center"><h2>⏸ Partida pausada</h2><p>El anfitrión reanudará el juego pronto.</p></div>';if(state.status==='finished')return app.innerHTML=`<div class="card center"><h2>Partida finalizada</h2><p>${esc(t.name)}</p><div class="score">${t.score||0} puntos</div></div>`;if(t.done)return app.innerHTML=`<div class="card center"><h2>🎉 ¡Habéis salvado la biblioteca!</h2><p>Equipo ${esc(t.name)}</p><div class="score">${t.score} puntos</div><p>Las palabras se pueden aprender escuchándolas, construyéndolas, leyéndolas y relacionándolas con imágenes. Cada persona merece los apoyos que necesita.</p></div>`;const p=t.progress||0;const m=missions[p];if(p>=5)return finalLock(t);app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Misión ${p+1} de 5</span><span class="score">${t.score||0} pts</span></div><h2>${esc(m.title)}</h2><p>${esc(m.desc)}</p><div id="challenge"></div><div id="feedback"></div><div class="row"><button class="btn secondary" id="hint">Necesito una pista</button></div></div>`;document.querySelector('#hint').onclick=()=>{help=true;document.querySelector('#feedback').innerHTML='<div class="warning">'+esc(m.hint)+'</div>'};renderChallenge(p)}
function speak(s){if(!('speechSynthesis'in window))return alert('Este navegador no admite lectura de voz');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.83;speechSynthesis.speak(u)}
function renderChallenge(p){const c=document.querySelector('#challenge');selection=[];choice='';stage=0;help=false;attempts=0;if(p===0){c.innerHTML='<h3>Construye la palabra</h3><div class="slots" id="slots"></div><div class="row" id="tiles"></div><div class="row"><button class="btn secondary" id="clear">Borrar</button><button class="btn" id="check">Comprobar</button></div>';const syll=['PO','SA','MA','RI'];function draw(){document.querySelector('#slots').innerHTML=selection.map(x=>`<span class="pill">${x}</span>`).join('');document.querySelector('#tiles').innerHTML=syll.map((s,i)=>`<button class="btn secondary syll" data-i="${i}" ${selection.some(x=>x.i===i)?'disabled':''}>${s}</button>`).join('');document.querySelector('#slots').innerHTML=selection.map(x=>`<span class="pill">${x.s}</span>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selection.push({i:+b.dataset.i,s:syll[+b.dataset.i]});draw()})}draw();document.querySelector('#clear').onclick=()=>{selection=[];draw()};document.querySelector('#check').onclick=()=>check(selection.map(x=>x.s).join('')==='MARIPOSA')}else if(p===1){c.innerHTML='<p class="notice">Escucha la palabra cuando el profesor la reproduzca en la proyección.</p><p>¿Cuál es el primer sonido de FOCA?</p><div id="opts"></div>';options(['F','S','M'],'F')}else if(p===2){c.innerHTML='<div class="center" style="font-size:60px" aria-label="Dibujo de una casa">🏠</div><h3 class="center">CA _ A</h3><p>¿Qué letra falta para escribir CASA?</p><div id="opts"></div>';options(['S','Z','P'],'S')}else if(p===3){c.innerHTML='<div class="notice"><strong>Historia:</strong> Ana fue a la biblioteca con su hermano Leo. Encontraron un libro sobre animales y lo leyeron juntos en una mesa azul.</div><p class="tiny muted">El profesor puede reproducir el cuento desde su proyección.</p><div id="opts"></div>';storyStep()}else{c.innerHTML='<div id="opts"></div>';supportStep()}}
function options(arr,correct){const el=document.querySelector('#opts');el.innerHTML=arr.map((x,i)=>`<button class="btn option" data-option="${i}">${esc(x)}</button>`).join('');el.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>check(arr[i]===correct))}
const story=[['¿Con quién fue Ana a la biblioteca?',['Con Leo','Con Sara','Sola'],'Con Leo'],['¿Sobre qué trataba el libro?',['Sobre planetas','Sobre animales','Sobre coches'],'Sobre animales'],['¿Dónde leyeron?',['En una mesa azul','En el patio','En el autobús'],'En una mesa azul']];const supports=[['Una alumna comprende mejor los textos cuando puede escucharlos. ¿Qué apoyo ofrecerías?',['Prohibirle los audios','Ofrecer texto y audio','Pedirle leer en voz alta sin opción'],'Ofrecer texto y audio'],['Un alumno necesita más tiempo para leer las instrucciones. ¿Qué harías?',['Dar instrucciones breves y tiempo flexible','Quitarle la actividad','Hacerle competir en velocidad'],'Dar instrucciones breves y tiempo flexible'],['¿Cómo podemos favorecer la participación?',['Dar apoyos visuales y opciones para responder','Corregir públicamente cada error','Usar solo textos largos'],'Dar apoyos visuales y opciones para responder']];
function storyStep(){const [q,arr,a]=story[stage];document.querySelector('#opts').innerHTML='<h3>'+esc(q)+'</h3>';const e=document.querySelector('#opts');arr.forEach(v=>{const b=document.createElement('button');b.className='btn option';b.textContent=v;b.onclick=()=>stepCheck(v===a,storyStep);e.appendChild(b)})}
function supportStep(){const [q,arr,a]=supports[stage];document.querySelector('#opts').innerHTML='<h3>'+esc(q)+'</h3>';const e=document.querySelector('#opts');arr.forEach(v=>{const b=document.createElement('button');b.className='btn option';b.textContent=v;b.onclick=()=>stepCheck(v===a,supportStep);e.appendChild(b)})}
function stepCheck(ok,next){if(!ok){attempts++;document.querySelector('#feedback').innerHTML='<div class="warning">Prueba otra respuesta. Puedes pedir una pista.</div>';return}stage++;document.querySelector('#feedback').innerHTML='';if(stage===3)success();else next()}
function check(ok){if(ok)success();else{attempts++;document.querySelector('#feedback').innerHTML='<div class="warning">Aún no es correcto. Inténtalo otra vez o pide una pista.</div>'}}
async function success(){const t=currentTeam(),p=t.progress||0,pts=help||attempts>=2?50:attempts===1?75:100;const fields={progress:p+1,score:(t.score||0)+pts,tries:{...(t.tries||{}),[p]:attempts}};document.querySelector('#challenge').innerHTML=`<div class="notice center"><h2>¡Misión superada!</h2><div class="bigletter">${missions[p].letter}</div><p>+${pts} puntos</p><p>Guarda esta letra para abrir la puerta final.</p><button class="btn" id="next">Continuar</button></div>`;document.querySelector('#feedback').innerHTML='';document.querySelector('#next').onclick=()=>updateTeam(teamId,fields)}
function finalLock(t){app.innerHTML=`<div class="card center"><h2>🔐 La puerta de la biblioteca</h2><p>Habéis recuperado las letras <strong>L · I · B · R · O</strong>. Escribe la contraseña para abrir la puerta.</p><label for="pass">Contraseña</label><input id="pass" placeholder="Escribe la palabra" maxlength="20" style="max-width:350px;text-align:center;text-transform:uppercase"><p><button class="btn" id="unlock">Abrir la puerta</button></p><div id="feedback"></div></div>`;document.querySelector('#unlock').onclick=async()=>{if(document.querySelector('#pass').value.trim().toUpperCase()==='LIBRO'){await updateTeam(teamId,{done:true,score:(t.score||0)+250})}else document.querySelector('#feedback').innerHTML='<div class="warning">La contraseña no coincide. Revisa las letras que habéis recuperado.</div>'}}
init();
</script></body></html>
