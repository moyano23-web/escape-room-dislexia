width:180px;height:180px;object-fit:contain;border:1px solid #ddd;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}button:focus-visible,input:focus-visible{outline:3px solid #ed9c67;outline-offset:2px}@media(max-width:600px){.card{padding:16px}h2{font-size:22px}}

sound:`<svg viewBox="0 0 240 150" role="img" aria-label="Foca junto a ondas de sonido"><ellipse cx="117" cy="127" rx="77" ry="10" fill="#80c5ce" opacity=".3"/><ellipse cx="117" cy="87" rx="71" ry="44" fill="#a9bacd"/><circle cx="92" cy="61" r="33" fill="#c4d4df"/><circle cx="82" cy="57" r="5" fill="#273d5b"/><circle cx="107" cy="57" r="5" fill="#273d5b"/><ellipse cx="95" cy="69" rx="8" ry="6" fill="#475e76"/><path d="M87 78q9 8 18 0" fill="none" stroke="#475e76" stroke-width="3"/><path d="M175 75q26-10 38 4m-36 13q31-3 36 17" fill="none" stroke="#57a7df" stroke-width="6" stroke-linecap="round"/><path d="M63 109 44 122m111-17 20 16" stroke="#899db3" stroke-width="12" stroke-linecap="round"/></svg>`,

support:`<svg viewBox="0 0 240 150" role="img" aria-label="Mochila con herramientas de aprendizaje"><ellipse cx="120" cy="135" rx="76" ry="8" fill="#71a9b3" opacity=".25"/><path d="M88 46V32q0-30 33-30t33 30v14" fill="none" stroke="#43aab3" stroke-width="10"/><rect x="63" y="43" width="116" height="88" rx="24" fill="#63c8ac"/><rect x="78" y="74" width="84" height="40" rx="13" fill="#e1fff1"/><rect x="99" y="87" width="42" height="13" rx="6" fill="#f6ba74"/><path d="M91 54h56" stroke="#dbfff3" stroke-width="6" stroke-linecap="round"/><path d="m188 23 5 10 12 2-9 8 2 12-10-6-10 6 2-12-9-8 12-2Z" fill="#ffce65"/></svg>`};
function visual(key,variant=''){return `<div class="mission-visual ${variant}">${art[key]||art.book}</div>`}
function finishOrder(){return Object.entries(state?.teams||{}).filter(([id,t])=>t.done&&t.finishedAt).sort((a,b)=>a[1].finishedAt-b[1].finishedAt || a[0].localeCompare(b[0]))}
function placeOf(id){const n=finishOrder().findIndex(([k])=>k===id);return n<0?null:n+1}
function elapsed(t){if(!t.finishedAt||!state?.startedAt)return '—';const seconds=Math.max(0,Math.floor((t.finishedAt-state.startedAt)/1000));return `${Math.floor(seconds/60)}m ${String(seconds%60).padStart(2,'0')}s`}

const app=document.querySelector('#app');const params=new URLSearchParams(location.search);let room=params.get('s')||'';let teamId=params.get('t')||'';let state=null,db=null,auth=null,uid=null,fb=null,unsub=null;let selection=[],choice='',attempts=0,stage=0,help=false,localMode=false;let hostKey=sessionStorage.getItem('hostKey')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=()=>Math.random().toString(36).slice(2,8).toUpperCase();const names=['Los Exploradores','Los Guardianes','Los Dragones','Las Estrellas','Los Detectives','Los Magos','Los Inventores','Los Lectores','Los Valientes'];
const missions=[{title:'El hechizo de las sílabas',desc:'Ordena las sílabas para formar el nombre de un insecto.',letter:'L',hint:'Empieza por MA. Puedes escuchar la palabra si alguien la lee en voz alta.'},{title:'Los sonidos encantados',desc:'Escucha la palabra y selecciona su sonido inicial.',letter:'I',hint:'La palabra es FOCA. Pronuncia despacio el primer sonido.'},{title:'Las letras desaparecidas',desc:'Completa la palabra: CA_A. Pista: es un lugar donde vivimos.',letter:'B',hint:'La palabra que buscamos es CASA.'},{title:'El libro de los secretos',desc:'Lee o escucha la historia y responde tres preguntas.',letter:'R',hint:'Puedes volver a escuchar el cuento cuantas veces necesites.'},{title:'La mochila de las soluciones',desc:'Elige apoyos que faciliten la participación de todo el alumnado.',letter:'O',hint:'Busca apoyos que den opciones y autonomía, sin excluir a nadie.'}];
function defaultState(code,key){return {code,hostKey:key,status:'waiting',created:Date.now(),teams:{},maxTeams:9,version:1}};
async function init(){if(FIREBASE_CONFIG){try{const a=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');const d=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');const au=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');const f=a.initializeApp(FIREBASE_CONFIG);auth=au.getAuth(f);await au.signInAnonymously(auth);uid=auth.currentUser.uid;db=d.getDatabase(f);fb=d;}catch(e){console.error(e);app.innerHTML='<div class="card warning">No se pudo conectar con Firebase. Comprueba la configuración, las reglas y la conexión a internet.</div>';return;}}else{localMode=true;}if(room)await loadRoom();else home();}
function saveLocal(){localStorage.setItem('escape_'+room,JSON.stringify(state));window.dispatchEvent(new Event('storageLocal'))}
async function write(path,value){if(localMode){if(path===''){state=value}else{const p=path.split('/');let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]]??(o[p[i]]={});o[p.at(-1)]=value;}saveLocal();render();return;}await fb.set(fb.ref(db,'rooms/'+room+(path?'/'+path:'')),value)}
async function updateTeam(id,fields){if(localMode){Object.assign(state.teams[id],fields);saveLocal();render();return;}await fb.update(fb.ref(db,'rooms/'+room+'/teams/'+id),fields)}
async function loadRoom(){if(localMode){state=JSON.parse(localStorage.getItem('escape_'+room)||'null');window.addEventListener('storage',()=>{state=JSON.parse(localStorage.getItem('escape_'+room)||'null');render()});window.addEventListener('storageLocal',()=>{state=JSON.parse(localStorage.getItem('escape_'+room)||'null');render()});render();}else{if(unsub)unsub();unsub=fb.onValue(fb.ref(db,'rooms/'+room),snap=>{state=snap.val();render()},e=>app.innerHTML='<div class="card warning">No se pudo abrir la sala: '+esc(e.message)+'</div>')}}
function home(){app.innerHTML=`<div class="card center">${visual('book')}<h2>¿Cómo quieres entrar?</h2><p>Recupera las cinco letras mágicas para abrir la biblioteca.</p><div class="row" style="justify-content:center"><button class="btn" id="create">Crear sala (anfitrión)</button><button class="btn secondary" id="join">Unirme a una sala</button></div>${localMode?'<p class="warning">Modo demostración local: los datos solo se comparten entre pestañas del mismo navegador. Para 45 participantes en distintos dispositivos es obligatorio configurar Firebase y publicar la web.</p>':''}</div>`;document.querySelector('#create').onclick=createRoom;document.querySelector('#join').onclick=()=>{app.innerHTML='<div class="card"><h2>Unirse a la partida</h2><label>Código de sala</label><input id="roomCode" maxlength="6" autocomplete="off" placeholder="Ej. ABC123"><button class="btn" id="go">Continuar</button></div>';document.querySelector('#go').onclick=()=>{room=document.querySelector('#roomCode').value.trim().toUpperCase();if(room)location.href='?s='+encodeURIComponent(room)}}}
async function createRoom(){room=rand();hostKey=crypto.randomUUID();sessionStorage.setItem('hostKey',hostKey);const s=defaultState(room,hostKey);if(!localMode){await fb.set(fb.ref(db,'rooms/'+room),s)}else{state=s;saveLocal()}location.href='?s='+encodeURIComponent(room)}
function isHost(){return !!(state&&hostKey===state.hostKey)}function currentTeam(){return state?.teams?.[teamId]}function render(){if(!state){app.innerHTML='<div class="card"><h2>Sala no encontrada</h2><p>Comprueba el código o solicita un nuevo enlace al profesor.</p><a href="./">Volver al inicio</a></div>';return;}if(isHost())return hostView();if(teamId&&currentTeam())return teamView();return joinView()}
function url(){return location.origin+location.pathname+'?s='+encodeURIComponent(room)}
function hostView(){const teams=Object.entries(state.teams||{}).sort((a,b)=>{if(a[1].done!==b[1].done)return a[1].done?-1:1;if(a[1].done&&b[1].done)return (a[1].finishedAt||Infinity)-(b[1].finishedAt||Infinity);return (b[1].progress||0)-(a[1].progress||0)||(b[1].score||0)-(a[1].score||0)});app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Panel del anfitrión</h2><span class="pill">Sala ${esc(room)}</span></div><p>Estado: <strong>${{waiting:'Esperando equipos',playing:'Partida en curso',paused:'Pausada',finished:'Finalizada'}[state.status]}</strong></p><div class="grid"><div><label>Enlace para jugadores</label><input id="link" readonly value="${esc(url())}"><button class="btn secondary" id="copy">Copiar enlace</button></div><div class="center"><img id="qr" alt="QR para entrar en la sala" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url())}"><p class="tiny muted">Si el QR no carga, comparte el enlace.</p></div></div>${localMode?'<div class="warning">Demostración local: esta sala no funciona entre móviles diferentes hasta conectar Firebase.</div>':''}<div class="row"><button class="btn good" id="start" ${state.status==='playing'?'disabled':''}>${state.status==='paused'?'Reanudar':'Iniciar partida'}</button><button class="btn secondary" id="pause" ${state.status!=='playing'?'disabled':''}>Pausar</button><button class="btn danger" id="finish">Finalizar</button><button class="btn secondary" id="reset">Reiniciar puntuaciones</button></div></div><div class="card"><h2>🔊 Sonido exclusivo del anfitrión</h2><p>Conecta el ordenador al proyector y sus altavoces. Solo este panel reproduce las narraciones; los móviles de los equipos permanecen en silencio.</p><div class="row"><button class="btn secondary" id="hostIntro">Presentar aventura</button><button class="btn secondary" id="hostFoca">Misión 2: escuchar FOCA</button><button class="btn secondary" id="hostStory">Misión 4: escuchar cuento</button><button class="btn secondary" id="hostStop">Detener audio</button></div><label for="hostMission">Instrucciones de una misión</label><select id="hostMission">${missions.map((m,i)=>`<option value="${i}">${i+1}. ${esc(m.title)}</option>`).join('')}</select><button class="btn secondary" id="hostReadMission">Leer instrucciones por altavoces</button><p class="tiny muted">El navegador puede requerir pulsar un botón para habilitar la voz.</p></div><div class="card"><h2>🏆 Clasificación por orden de llegada (${teams.length}/${state.maxTeams} equipos)</h2><p class="muted tiny">Los equipos que completan las cinco misiones se ordenan por tiempo de llegada. Los puntos se muestran aparte.</p><table class="ranklist"><thead><tr><th>Puesto · Equipo</th><th>Misión</th><th>Puntos</th><th>Tiempo</th></tr></thead><tbody>${teams.map(([id,t],i)=>`<tr><td>${t.done?placeOf(id)+'.':'—'} ${esc(t.name)}</td><td>${Math.min(t.progress||0,5)}/5</td><td><strong>${t.score||0}</strong></td><td>${t.done?elapsed(t):t.progress?'En juego':'Preparado'}</td></tr>`).join('')||'<tr><td colspan="4">Esperando equipos…</td></tr>'}</tbody></table></div>`;document.querySelector('#hostIntro').onclick=()=>speak('Bienvenidos a la biblioteca de las palabras perdidas. Para salvar sus libros, tendréis que superar cinco misiones y descubrir la contraseña final.');document.querySelector('#hostFoca').onclick=()=>speak('Foca');document.querySelector('#hostStory').onclick=()=>speak('Ana fue a la biblioteca con su hermano Leo. Encontraron un libro sobre animales y lo leyeron juntos en una mesa azul.');document.querySelector('#hostStop').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel()};document.querySelector('#hostReadMission').onclick=()=>{const m=missions[Number(document.querySelector('#hostMission').value)];speak(m.title+'. '+m.desc)};document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(url()).then(()=>alert('Enlace copiado'));document.querySelector('#start').onclick=async()=>{if(!state.startedAt)await write('startedAt',localMode?Date.now():fb.serverTimestamp());await write('status','playing')};document.querySelector('#pause').onclick=()=>write('status','paused');document.querySelector('#finish').onclick=()=>{if(confirm('¿Finalizar la partida?'))write('status','finished')};document.querySelector('#reset').onclick=async()=>{if(!confirm('¿Reiniciar los progresos de todos los equipos?'))return;for(const [id,t] of teams)await updateTeam(id,{progress:0,score:0,done:false,finishedAt:null,tries:{}});await write('startedAt',null);await write('status','waiting')}}
function joinView(){const teams=Object.entries(state.teams||{});app.innerHTML=`<div class="card">${visual('book')}<h2>Entrar en la biblioteca</h2><p>Sala <strong>${esc(room)}</strong>. Forma un equipo de hasta cinco personas y selecciona su nombre.</p><label>Equipo</label><select id="teamSelect"><option value="">Selecciona tu equipo</option>${names.map((n,i)=>`<option value="${i+1}" ${teams.some(([id])=>id===String(i+1))?'disabled':''}>${esc(n)}${teams.some(([id])=>id===String(i+1))?' (ocupado)':''}</option>`).join('')}</select><button class="btn" id="enter">Entrar</button><p class="muted tiny">Un dispositivo por equipo. El anfitrión controla el inicio de la partida.</p></div>`;document.querySelector('#enter').onclick=async()=>{const id=document.querySelector('#teamSelect').value;if(!id)return alert('Selecciona un equipo');if(state.teams?.[id])return alert('Este equipo ya está ocupado');if(localMode){state.teams[id]={name:names[+id-1],progress:0,score:0,tries:{},done:false};saveLocal()}else{const ref=fb.ref(db,'rooms/'+room+'/teams/'+id);const result=await fb.runTransaction(ref,t=>t===null?{name:names[+id-1],progress:0,score:0,tries:{},done:false}:undefined);if(!result.committed)return alert('Este equipo ya está ocupado')}teamId=id;sessionStorage.setItem('team_'+room,id);location.href='?s='+encodeURIComponent(room)+'&t='+id}}
function teamView(){const t=currentTeam();if(state.status==='waiting')return app.innerHTML=`<div class="card center">${visual('book')}<h2>¡Equipo ${esc(t.name)} preparado!</h2><p>Esperad a que el anfitrión inicie la aventura.</p><span class="pill">Sala ${esc(room)}</span></div>`;if(state.status==='paused')return app.innerHTML='<div class="card center"><h2>⏸ Partida pausada</h2><p>El anfitrión reanudará el juego pronto.</p></div>';if(state.status==='finished')return app.innerHTML=`<div class="card center">${visual('book')}<h2>Partida finalizada</h2><div class="finish-rank">${placeOf(teamId)?placeOf(teamId)+'.º puesto':'Sin finalizar'}<small>Orden de llegada</small></div><p>${esc(t.name)}</p><div class="score">${t.score||0} puntos</div></div>`;if(t.done)return app.innerHTML=`<div class="card center">${visual('book')}<h2>¡Habéis salvado la biblioteca!</h2><div class="finish-rank">${placeOf(teamId)?placeOf(teamId)+'.º puesto':'Esperando clasificación'}<small>Orden de llegada</small></div><p>Tiempo de llegada: <strong>${elapsed(t)}</strong></p><p>Equipo ${esc(t.name)}</p><div class="score">${t.score} puntos</div><p>Las palabras se pueden aprender escuchándolas, construyéndolas, leyéndolas y relacionándolas con imágenes. Cada persona merece los apoyos que necesita.</p></div>`;const p=t.progress||0;const m=missions[p];if(p>=5)return finalLock(t);app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Misión ${p+1} de 5</span><span class="score">${t.score||0} pts</span></div><div class="progress-track"><div style="width:${20*p}%"></div></div>${visual(['butterfly','sound','house','story','support'][p],['magic-illustration','sound-illustration','house-illustration','story-illustration','support-illustration'][p])}<div class="mission-meta"><h2>${esc(m.title)}</h2><span class="duration">⏱ Tiempo orientativo: 1–2 min</span></div><p>${esc(m.desc)}</p><div id="challenge"></div><div id="feedback"></div><div class="row"><button class="btn secondary" id="hint">Necesito una pista</button></div></div>`;document.querySelector('#hint').onclick=()=>{help=true;document.querySelector('#feedback').innerHTML='<div class="warning">'+esc(m.hint)+'</div>'};renderChallenge(p)}
function speak(s){if(!('speechSynthesis'in window))return alert('Este navegador no admite lectura de voz');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.83;speechSynthesis.speak(u)}
function renderChallenge(p){const c=document.querySelector('#challenge');selection=[];choice='';stage=0;help=false;attempts=0;if(p===0){c.innerHTML='<h3>Construye la palabra</h3><div class="slots" id="slots"></div><div class="row" id="tiles"></div><div class="row"><button class="btn secondary" id="clear">Borrar</button><button class="btn" id="check">Comprobar</button></div>';const syll=['PO','SA','MA','RI'];function draw(){document.querySelector('#slots').innerHTML=selection.map(x=>`<span class="pill">${x}</span>`).join('');document.querySelector('#tiles').innerHTML=syll.map((s,i)=>`<button class="btn secondary syll" data-i="${i}" ${selection.some(x=>x.i===i)?'disabled':''}>${s}</button>`).join('');document.querySelector('#slots').innerHTML=selection.map(x=>`<span class="pill">${x.s}</span>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selection.push({i:+b.dataset.i,s:syll[+b.dataset.i]});draw()})}draw();document.querySelector('#clear').onclick=()=>{selection=[];draw()};document.querySelector('#check').onclick=()=>check(selection.map(x=>x.s).join('')==='MARIPOSA')}else if(p===1){c.innerHTML='<p class="notice">Escucha la palabra cuando el profesor la reproduzca en la proyección.</p><p>¿Cuál es el primer sonido de FOCA?</p><div id="opts"></div>';options(['F','S','M'],'F')}else if(p===2){c.innerHTML='<div class="center" style="font-size:60px" aria-label="Dibujo de una casa">🏠</div><h3 class="center">CA _ A</h3><p>¿Qué letra falta para escribir CASA?</p><div id="opts"></div>';options(['S','Z','P'],'S')}else if(p===3){c.innerHTML='<div class="notice"><strong>Historia:</strong> Ana fue a la biblioteca con su hermano Leo. Encontraron un libro sobre animales y lo leyeron juntos en una mesa azul.</div><p class="tiny muted">El profesor puede reproducir el cuento desde su proyección.</p><div id="opts"></div>';storyStep()}else{c.innerHTML='<div id="opts"></div>';supportStep()}}
function options(arr,correct){const el=document.querySelector('#opts');el.innerHTML=arr.map((x,i)=>`<button class="btn option" data-option="${i}">${esc(x)}</button>`).join('');el.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>check(arr[i]===correct))}
const story=[['¿Con quién fue Ana a la biblioteca?',['Con Leo','Con Sara','Sola'],'Con Leo'],['¿Sobre qué trataba el libro?',['Sobre planetas','Sobre animales','Sobre coches'],'Sobre animales'],['¿Dónde leyeron?',['En una mesa azul','En el patio','En el autobús'],'En una mesa azul']];const supports=[['Una alumna comprende mejor los textos cuando puede escucharlos. ¿Qué apoyo ofrecerías?',['Prohibirle los audios','Ofrecer texto y audio','Pedirle leer en voz alta sin opción'],'Ofrecer texto y audio'],['Un alumno necesita más tiempo para leer las instrucciones. ¿Qué harías?',['Dar instrucciones breves y tiempo flexible','Quitarle la actividad','Hacerle competir en velocidad'],'Dar instrucciones breves y tiempo flexible'],['¿Cómo podemos favorecer la participación?',['Dar apoyos visuales y opciones para responder','Corregir públicamente cada error','Usar solo textos largos'],'Dar apoyos visuales y opciones para responder']];
function storyStep(){const [q,arr,a]=story[stage];document.querySelector('#opts').innerHTML='<h3>'+esc(q)+'</h3>';const e=document.querySelector('#opts');arr.forEach(v=>{const b=document.createElement('button');b.className='btn option';b.textContent=v;b.onclick=()=>stepCheck(v===a,storyStep);e.appendChild(b)})}
function supportStep(){const [q,arr,a]=supports[stage];document.querySelector('#opts').innerHTML='<h3>'+esc(q)+'</h3>';const e=document.querySelector('#opts');arr.forEach(v=>{const b=document.createElement('button');b.className='btn option';b.textContent=v;b.onclick=()=>stepCheck(v===a,supportStep);e.appendChild(b)})}
function stepCheck(ok,next){if(!ok){attempts++;document.querySelector('#feedback').innerHTML='<div class="warning">Prueba otra respuesta. Puedes pedir una pista.</div>';return}stage++;document.querySelector('#feedback').innerHTML='';if(stage===3)success();else next()}
function check(ok){if(ok)success();else{attempts++;document.querySelector('#feedback').innerHTML='<div class="warning">Aún no es correcto. Inténtalo otra vez o pide una pista.</div>'}}
async function success(){const t=currentTeam(),p=t.progress||0,pts=help||attempts>=2?50:attempts===1?75:100;const fields={progress:p+1,score:(t.score||0)+pts,tries:{...(t.tries||{}),[p]:attempts}};document.querySelector('#challenge').innerHTML=`<div class="notice center"><h2>¡Misión superada!</h2><div class="bigletter">${missions[p].letter}</div><p>+${pts} puntos</p><p>Guarda esta letra para abrir la puerta final.</p><button class="btn" id="next">Continuar</button></div>`;document.querySelector('#feedback').innerHTML='';document.querySelector('#next').onclick=()=>updateTeam(teamId,fields)}
function finalLock(t){app.innerHTML=`<div class="card center">${visual('book')}<h2>🔐 La puerta de la biblioteca</h2><p>Habéis recuperado las letras <strong>L · I · B · R · O</strong>. Escribe la contraseña para abrir la puerta.</p><label for="pass">Contraseña</label><input id="pass" placeholder="Escribe la palabra" maxlength="20" style="max-width:350px;text-align:center;text-transform:uppercase"><p><button class="btn" id="unlock">Abrir la puerta</button></p><div id="feedback"></div></div>`;document.querySelector('#unlock').onclick=async()=>{if(document.querySelector('#pass').value.trim().toUpperCase()==='LIBRO'){await updateTeam(teamId,{done:true,score:(t.score||0)+250,finishedAt:localMode?Date.now():fb.serverTimestamp()})}else document.querySelector('#feedback').innerHTML='<div class="warning">La contraseña no coincide. Revisa las letras que habéis recuperado.</div>'}}
init();
</script></body></html>
